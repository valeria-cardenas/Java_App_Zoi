<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoi - Editar usuario</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/zoi-ui.css}">
</head>
<body class="zoi-ui">
<header class="admin-header">
    <a th:href="@{/admin}" class="brand"><img th:src="@{/img/logo.png}" alt="Zoi" class="brand-logo"><span>Administrador</span></a>
</header>
<main class="admin-main">
    <section class="form-section edit-user-panel">
        <div class="section-title">
            <h1>Editar usuario</h1>
            <a th:href="@{/admin}">Volver</a>
        </div>
        <div class="flash error-flash" th:if="${errorAdmin}" th:text="${errorAdmin}">Error</div>
        <form th:action="@{/admin/usuarios/{id}(id=${usuario.id})}" method="post" class="create-user-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>Nombre
                <input type="text" name="nombre" th:value="${usuario.nombre}" pattern="[^0-9]{2,80}" required>
            </label>
            <label>Apellido
                <input type="text" name="apellido" th:value="${usuario.apellido}" pattern="[^0-9]{2,80}" required>
            </label>
            <label>Correo
                <input type="email" name="email" th:value="${usuario.email}" required>
            </label>
            <label>Teléfono
                <input type="tel" name="telefono" th:value="${usuario.telefono}" pattern="[0-9 +()-]{7,20}">
            </label>
            <label>Perfil
                <select name="tipoPerfil">
                    <option value="DUENO" th:selected="${usuario.tipoPerfil != 'VETERINARIO'}">Dueño</option>
                    <option value="VETERINARIO" th:selected="${usuario.tipoPerfil == 'VETERINARIO'}">Veterinario
                    </option>
                </select>
            </label>
            <button type="submit" class="zoi-btn-primary">Guardar cambios</button>
        </form>
    </section>
</main>
<script th:src="@{/js/zoi-validation.js}"></script>
</body>
</html>
