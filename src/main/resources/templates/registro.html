<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoi - Crea tu cuenta</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
    <link rel="stylesheet" th:href="@{/css/valores.css}">
    <link rel="stylesheet" th:href="@{/css/zoi-pages.css}">
    <link rel="stylesheet" th:href="@{/css/zoi-ui.css}">
</head>

<body class="zoi-page zoi-ui">
<header class="site-header">
    <div class="logo-zoi">
        <a th:href="@{/}"><img th:src="@{/img/logo.png}" alt="Zoi" class="logo-img"></a>
    </div>
    <nav class="main-nav">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/proposito}">Proposito</a>
        <a th:href="@{/beneficios}">Beneficios</a>
        <a th:href="@{/valores}">Valores</a>
    </nav>
    <div class="auth-buttons">
        <a th:href="@{/login}" class="btn-secondary">Iniciar Sesion</a>
        <a th:href="@{/registro}" class="btn-primary active-link">Registrate</a>
    </div>
</header>

<main class="contenedor-registro">
    <div class="logo-zoi">
        <h1>Crea tu cuenta</h1>
    </div>

    <section class="tarjeta-registro">
        <div th:if="${errorRegistro}" class="form-error" role="alert" th:text="${errorRegistro}">Error</div>
        <form id="registroForm" th:action="@{/registro}" th:object="${usuario}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="nombre">Nombre</label>
            <input type="text" th:field="*{nombre}" id="nombre"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{2,80}" minlength="2" maxlength="80"
                   aria-describedby="nombreError" placeholder="Ej. Nicol" required>
            <small id="nombreError" class="field-error"
                   th:text="${erroresRegistro != null ? erroresRegistro['nombre'] : ''}"></small>

            <label for="apellido">Apellido</label>
            <input type="text" th:field="*{apellido}" id="apellido"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{2,80}" minlength="2" maxlength="80"
                   aria-describedby="apellidoError" placeholder="Ej. Gómez" required>
            <small id="apellidoError" class="field-error"
                   th:text="${erroresRegistro != null ? erroresRegistro['apellido'] : ''}"></small>

            <label for="email">Correo electrónico</label>
            <input type="email" th:field="*{email}" id="email" maxlength="120"
                   pattern="[A-Za-z0-9._%+\-]+@(gmail\.com|outlook\.com)"
                   aria-describedby="emailHint emailError" placeholder="ejemplo@gmail.com" required>
            <small id="emailHint" class="field-hint">Solo se permiten cuentas Gmail u Outlook.</small>
            <small id="emailError" class="field-error"
                   th:text="${erroresRegistro != null ? erroresRegistro['email'] : ''}"></small>

            <label for="telefono">Teléfono</label>
            <input type="tel" th:field="*{telefono}" id="telefono"
                   pattern="[0-9 +()\-]{7,20}" minlength="7" maxlength="20"
                   aria-describedby="telefonoError" placeholder="Ej. 300 123 4567" required>
            <small id="telefonoError" class="field-error"
                   th:text="${erroresRegistro != null ? erroresRegistro['telefono'] : ''}"></small>

            <label for="password">Contraseña</label>
            <input type="password" th:field="*{password}" id="password"
                   minlength="8" maxlength="72" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,72}"
                   aria-describedby="passwordHint passwordError" placeholder="Mínimo 8 caracteres" required>
            <small id="passwordHint" class="field-hint">Incluye mayúscula, minúscula y número.</small>
            <small id="passwordError" class="field-error"
                   th:text="${erroresRegistro != null ? erroresRegistro['password'] : ''}"></small>

            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" name="confirmPassword" id="confirmPassword"
                   minlength="8" maxlength="72" aria-describedby="confirmPasswordError"
                   placeholder="Confirma tu contraseña" required>
            <small id="confirmPasswordError" class="field-error"
                   th:text="${erroresRegistro != null ? erroresRegistro['confirmPassword'] : ''}"></small>

            <button type="submit" class="boton-primario">Crear Cuenta</button>
        </form>

        <p class="texto-secundario">
            Ya tienes cuenta? <a th:href="@{/login}">Inicia sesion</a>
        </p>
    </section>
</main>
<script>
    const form = document.getElementById('registroForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const messages = {
        nombre: 'Escribe un nombre válido usando solo letras y espacios.',
        apellido: 'Escribe un apellido válido usando solo letras y espacios.',
        email: 'Usa una dirección terminada en @gmail.com o @outlook.com.',
        telefono: 'Ingresa un teléfono válido de 7 a 20 caracteres.',
        password: 'Usa entre 8 y 72 caracteres, con mayúscula, minúscula y número.'
    };

    Object.entries(messages).forEach(([id, message]) => {
        const field = document.getElementById(id);
        field.addEventListener('invalid', () => {
            field.setCustomValidity(field.validity.valueMissing ? 'Este campo es obligatorio.' : message);
        });
        field.addEventListener('input', () => field.setCustomValidity(''));
    });

    const validateConfirmation = () => {
        confirmPassword.setCustomValidity(
            confirmPassword.value && confirmPassword.value !== password.value
                ? 'Las contraseñas no coinciden.'
                : ''
        );
    };
    password.addEventListener('input', validateConfirmation);
    confirmPassword.addEventListener('input', validateConfirmation);
    form.addEventListener('submit', validateConfirmation);
</script>

<script th:src="@{/js/zoi-validation.js}"></script>
<footer class="pie-pagina site-footer">
    <p>2026 ZOI - Con carino para tus mascotas</p>
</footer>
</body>
</html>
