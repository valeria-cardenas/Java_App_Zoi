spring.application.name=appzoi
server.port=8080
# Conexion
spring.datasource.url=${ZOI_DB_URL:jdbc:mariadb://localhost:3306/zoi_java}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${ZOI_DB_USER:root}
spring.datasource.password=${ZOI_DB_PASSWORD:}
# Hibernate para Spring Boot 4 / Hibernate 7
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${ZOI_SHOW_SQL:false}
spring.datasource.continue-on-error=true
spring.jpa.open-in-view=false
# Archivos cargados por usuarios
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
app.upload.dir=uploads
app.admin.initial-password=${ZOI_ADMIN_PASSWORD:}
